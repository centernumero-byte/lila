<style>
/* ===== Русская тема — фиолетово-серая, казахская — зелёно-серая ===== */
:root, html[data-lang="ru"] {
  --bg1:#1e1b29; --bg2:#2c2840; --panel1:#363150; --panel2:#24203a; --card1:#3d3758; --card2:#2b2742;
  --glow:rgba(170,150,230,.20); --gold:#d9c8ff; --gold2:#b7a3ee; --text:#efedf5; --muted:#b5afc8;
  --line:rgba(190,170,240,.50); --line-soft:rgba(190,170,240,.22); --hover:rgba(170,150,230,.14);
  --active1:rgba(130,110,200,.55); --active2:rgba(95,80,160,.35); --btn1:#6f5fb0; --btn2:#54468f; --input:rgba(0,0,0,.22);
  --cell:#3a3553; --cell2:#332e4b; --center:#4e4472;
}
html[data-lang="kz"] {
  --bg1:#18211d; --bg2:#25322c; --panel1:#2f3f37; --panel2:#1f2b25; --card1:#364a40; --card2:#26352e;
  --glow:rgba(140,200,165,.18); --gold:#cfe9d6; --gold2:#a6d1b4; --text:#eef3ef; --muted:#aec2b5;
  --line:rgba(160,210,180,.50); --line-soft:rgba(160,210,180,.22); --hover:rgba(140,200,165,.13);
  --active1:rgba(90,150,115,.55); --active2:rgba(65,115,88,.35); --btn1:#4f8a68; --btn2:#3b6d51; --input:rgba(0,0,0,.22);
  --cell:#33463c; --cell2:#2c3d34; --center:#41604f;
}
html[data-lang="uz"] {
  --bg1:#16212a; --bg2:#22323d; --panel1:#2b414d; --panel2:#1c2a33; --card1:#31505d; --card2:#233843;
  --glow:rgba(120,200,215,.18); --gold:#cdeef3; --gold2:#9fd3dc; --text:#eef5f6; --muted:#a9c3c9;
  --line:rgba(150,210,220,.50); --line-soft:rgba(150,210,220,.22); --hover:rgba(120,200,215,.13);
  --active1:rgba(70,150,165,.55); --active2:rgba(50,115,128,.35); --btn1:#3f8796; --btn2:#2f6a76; --input:rgba(0,0,0,.22);
  --cell:#2f4652; --cell2:#283d48; --center:#3c5f6d;
}
html[data-lang="uz"] .dice { background:#f0f8f9; color:#1d3640; }
* { box-sizing:border-box; }
html, body { margin:0; }
body { font-family:Arial, Helvetica, sans-serif; color:var(--text); min-height:100vh;
  background: radial-gradient(circle at 72% 12%, var(--glow), transparent 30%),
              radial-gradient(circle at 18% 85%, var(--glow), transparent 32%),
              linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 50%, var(--bg1) 100%);
  background-attachment:fixed; transition:background .4s, color .4s; -webkit-font-smoothing:antialiased; }
h1,h2,h3 { font-family:"PT Serif", Georgia, serif; font-weight:500; color:var(--gold); margin:0 0 .5em; line-height:1.2; }
button, input, select, textarea { font:inherit; color:inherit; }
a { color:var(--gold); }
.hidden { display:none !important; }
#app { min-height:100vh; display:flex; flex-direction:column; }

/* ===== Каркас ===== */
.platform { flex:1; display:flex; padding:8px; }
.sidebar { width:240px; flex-shrink:0; padding:24px 14px 18px; border:1px solid var(--line); border-radius:18px 0 0 18px;
  background: radial-gradient(circle at 50% 8%, var(--glow), transparent 30%), linear-gradient(180deg, var(--panel1) 0%, var(--panel2) 100%);
  display:flex; flex-direction:column; transition:background .4s; }
.side-head { display:block; }
.logo { text-align:center; margin-bottom:26px; }
.logo-symbol { width:92px; height:92px; margin:0 auto 12px; border-radius:50%; border:2px solid var(--gold2);
  display:flex; align-items:center; justify-content:center; font-size:42px; box-shadow:0 0 22px var(--glow), inset 0 0 20px var(--glow); }
.logo-title { font-family:"PT Serif", Georgia, serif; font-size:24px; color:var(--gold); letter-spacing:2px; text-transform:uppercase; }
.logo-subtitle { margin-top:6px; font-size:17px; color:var(--gold2); }
.nav { display:flex; flex-direction:column; gap:6px; }
.nav-sep { height:1px; background:var(--line-soft); margin:8px 6px; }
.nav-item { width:100%; min-height:46px; padding:11px 14px; border-radius:12px; border:1px solid transparent; background:transparent;
  color:var(--text); font-size:16px; text-align:left; cursor:pointer; display:flex; align-items:center; gap:4px; transition:background .25s, border-color .25s; }
.nav-item:hover { background:var(--hover); border-color:var(--line-soft); }
.nav-item.active { background:linear-gradient(90deg, var(--active1), var(--active2)); border-color:var(--gold2); color:var(--gold); }
.nav-icon { display:inline-flex; width:32px; min-width:32px; justify-content:center; font-size:19px; }
.nav .logout { margin-top:14px; color:var(--gold); }
.burger { display:none; }
.main { flex:1; min-width:0; padding:30px 28px 26px; border:1px solid var(--line); border-left:none; border-radius:0 18px 18px 0;
  background: radial-gradient(circle at 55% 4%, var(--glow), transparent 30%), linear-gradient(160deg, var(--panel2), var(--bg2));
  display:flex; flex-direction:column; transition:background .4s; }
.topbar { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:22px; flex-wrap:wrap; }
.topbar h1 { margin:0; font-size:34px; }
.lang-switch { display:flex; border:1px solid var(--line); border-radius:999px; padding:3px; background:var(--input); }
.lang-switch button { border:0; background:transparent; color:var(--text); padding:7px 14px; border-radius:999px; cursor:pointer; font-size:14px; }
.lang-switch button.on { background:linear-gradient(90deg, var(--btn1), var(--btn2)); color:var(--gold); box-shadow:inset 0 0 0 1px var(--gold2); }
#main { flex:1; }

/* ===== Общие ===== */
.card { border:1px solid var(--line); border-radius:18px; padding:20px;
  background: radial-gradient(circle at 50% 0%, var(--glow), transparent 45%), linear-gradient(145deg, var(--card1), var(--card2)); box-shadow:0 10px 30px rgba(0,0,0,.18); }
.muted { color:var(--muted); }
.row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.btn { border:1px solid var(--gold2); background:linear-gradient(90deg, var(--btn1), var(--btn2)); color:var(--gold); padding:11px 18px; border-radius:11px; cursor:pointer; font-size:15px; }
.btn:hover { filter:brightness(1.12); }
.btn:disabled { opacity:.5; cursor:default; filter:none; }
.btn.ghost { background:transparent; color:var(--text); border-color:var(--line-soft); }
.btn.small { padding:7px 11px; font-size:13px; border-radius:9px; }
.btn.danger { background:linear-gradient(90deg,#9b3434,#7a2626); border-color:#d98a8a; color:#ffe2e2; }
input, select, textarea { width:100%; border:1px solid var(--line-soft); background:var(--input); color:var(--text); border-radius:10px; padding:11px 13px; outline:none; }
select option { color:#111; }
input:focus, select:focus, textarea:focus { border-color:var(--gold2); }
input::placeholder, textarea::placeholder { color:var(--muted); opacity:.75; }
textarea { min-height:90px; resize:vertical; }
label.f { display:block; font-size:13px; color:var(--muted); margin:12px 0 5px; }
.empty { text-align:center; padding:36px 16px; color:var(--muted); }
.badge { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; border:1px solid var(--line-soft); }
.badge.ok { background:rgba(80,190,120,.18); color:#a8f0bf; border-color:rgba(120,220,150,.5); }
.badge.no { background:rgba(220,90,90,.15); color:#ffb4b4; border-color:rgba(240,130,130,.45); }
table.list { width:100%; border-collapse:collapse; font-size:14px; }
table.list th, table.list td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line-soft); vertical-align:middle; }
table.list th { color:var(--gold2); font-weight:normal; font-size:13px; }
.table-wrap { overflow-x:auto; }
.code { font-family:ui-monospace, Menlo, monospace; font-size:24px; letter-spacing:3px; color:var(--gold); border:1px solid var(--line); background:var(--input); padding:8px 16px; border-radius:10px; display:inline-block; }
.toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#111; color:#fff; border:1px solid var(--gold2); padding:10px 16px; border-radius:12px; z-index:200; font-size:14px; }
footer.foot { text-align:center; padding:16px; font-size:14px; color:var(--muted); }
footer.foot b { color:var(--gold); font-family:"PT Serif", Georgia, serif; font-weight:normal; font-size:16px; }

/* ===== Настройка игры ===== */
.setup { max-width:760px; }
.count-btns { display:flex; gap:8px; flex-wrap:wrap; }
.count-btns button { width:46px; height:46px; border-radius:12px; border:1px solid var(--line-soft); background:var(--input); color:var(--text); cursor:pointer; font-size:18px; }
.count-btns button.on { border-color:var(--gold2); color:var(--gold); background:linear-gradient(90deg, var(--active1), var(--active2)); }
.player-row { display:grid; grid-template-columns:28px 1fr 2fr; gap:10px; align-items:start; margin-top:12px; }
.player-row .dot { width:22px; height:22px; border-radius:50%; margin-top:10px; border:2px solid rgba(255,255,255,.8); }

/* ===== Поле ===== */
.game { display:grid; grid-template-columns:minmax(0, 1fr) 320px; gap:18px; align-items:start; }
@media (max-width:1100px){ .game { grid-template-columns:1fr; } }
.board-wrap { position:relative; border:1px solid var(--line); border-radius:16px; padding:6px; background:rgba(0,0,0,.15); }
.board { display:grid; grid-template-columns:repeat(9, 1fr); gap:4px; position:relative; }
.cell { position:relative; aspect-ratio:1/1; border-radius:8px; background:var(--cell); border:1px solid var(--line-soft); cursor:pointer;
  padding:4px 4px 3px; display:flex; flex-direction:column; justify-content:space-between; overflow:hidden; transition:transform .15s, border-color .15s; }
.cell:nth-child(odd) { background:var(--cell2); }
.cell:hover { border-color:var(--gold2); transform:scale(1.03); z-index:2; }
.cell.center { background:var(--center); }
.cell.goal { background:linear-gradient(145deg, var(--btn1), var(--center)); border-color:var(--gold2); }
.cell .num, .cell .nm, .tokens, .cell .ico { position:relative; z-index:3; }
.cell .num, .cell .nm { text-shadow:0 0 3px rgba(0,0,0,.9), 0 0 6px rgba(0,0,0,.6); }
.cell .num { font-size:12px; color:var(--gold2); font-weight:bold; }
.cell .nm { font-size:clamp(7px, .78vw, 11px); line-height:1.12; color:var(--text); overflow-wrap:anywhere; hyphens:auto; overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; }
.cell .ico { position:absolute !important; left:3px; bottom:2px; font-size:clamp(9px, 1.1vw, 15px); line-height:1; z-index:3; }
.cell.last { box-shadow:0 0 0 2px var(--gold) inset; }
.tokens { position:absolute !important; top:3px; right:3px; display:flex; flex-wrap:wrap; gap:2px; max-width:60%; justify-content:flex-end; }
.tok { width:clamp(9px, 1.15vw, 15px); height:clamp(9px, 1.15vw, 15px); border-radius:50%; border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.5); }
.tok.cur { animation:pulse 1s infinite; }
@keyframes pulse { 50% { transform:scale(1.35); } }
svg.links { z-index:1; position:absolute; inset:6px; width:calc(100% - 12px); height:calc(100% - 12px); pointer-events:none; overflow:visible; }
.phone-hint { display:none; font-size:12px; color:var(--muted); margin-top:6px; }
.mbar { display:none; position:sticky; bottom:8px; z-index:30; align-items:center; gap:10px; padding:10px 12px; margin-top:10px; border:1px solid var(--line); border-radius:16px; background:linear-gradient(145deg, var(--card1), var(--card2)); box-shadow:0 8px 24px rgba(0,0,0,.45); }
.mbar .dice { width:52px; height:52px; font-size:28px; margin:0; border-radius:12px; flex-shrink:0; }
.mbar .who { flex:1; min-width:0; font-size:14px; line-height:1.3; }
.mbar .who b { color:var(--gold); }
.mbar .btn { padding:12px 14px; white-space:nowrap; }
.legend { display:flex; gap:16px; font-size:13px; color:var(--muted); margin-top:8px; flex-wrap:wrap; }

/* ===== Панель хода ===== */
.side-panel { display:flex; flex-direction:column; gap:14px; }
.turn-box { text-align:center; }
.turn-box .who { font-family:"PT Serif", Georgia, serif; font-size:22px; color:var(--gold); }
.dice { width:84px; height:84px; margin:14px auto; border-radius:18px; background:#f6f3ff; color:#2a2440; display:flex; align-items:center; justify-content:center;
  font-size:46px; font-weight:bold; box-shadow:0 8px 22px rgba(0,0,0,.35); }
html[data-lang="kz"] .dice { background:#f2f8f3; color:#1f3328; }
.dice.roll { animation:roll .55s ease-out; }
@keyframes roll { 0%{ transform:rotate(0) scale(.6);} 60%{ transform:rotate(320deg) scale(1.1);} 100%{ transform:rotate(360deg) scale(1);} }
.msg-box { min-height:44px; font-size:14px; line-height:1.45; color:var(--text); }
.plist { display:flex; flex-direction:column; gap:8px; }
.pitem { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px; border:1px solid var(--line-soft); background:var(--input); font-size:14px; }
.pitem.cur { border-color:var(--gold2); }
.pitem .dot { width:16px; height:16px; border-radius:50%; border:2px solid #fff; flex-shrink:0; }
.pitem > span:nth-child(2) { min-width:0; flex:1; overflow-wrap:break-word; }
.pitem .pos { margin-left:auto; color:var(--gold2); text-align:right; font-size:13px; max-width:45%; overflow-wrap:break-word; }
.pitem { flex-wrap:nowrap; min-width:0; }
.side-panel { min-width:0; }
.side-panel .row .btn { white-space:normal; }
.log { max-height:220px; overflow:auto; font-size:13px; color:var(--muted); line-height:1.5; }

/* ===== Карточка клетки ===== */
.modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100; display:flex; align-items:center; justify-content:center; padding:16px; }
.modal { width:100%; max-width:640px; max-height:92vh; overflow:auto; border:1px solid var(--line); border-radius:20px; padding:24px;
  background: radial-gradient(circle at 50% 0%, var(--glow), transparent 45%), linear-gradient(145deg, var(--card1), var(--card2)); box-shadow:0 20px 70px rgba(0,0,0,.5); }
.modal .cnum { width:56px; height:56px; border-radius:50%; border:2px solid var(--gold2); display:flex; align-items:center; justify-content:center; font-size:22px; color:var(--gold); font-family:"PT Serif", Georgia, serif; }
.modal h2 { font-size:26px; margin:0; }
.modal .alt { color:var(--gold2); font-size:15px; margin-top:2px; }
.modal .sub { font-style:italic; color:var(--muted); margin:12px 0; }
.modal p.text { line-height:1.6; }
.link-note { padding:10px 12px; border-radius:10px; margin:12px 0; font-size:14px; line-height:1.45; }
.link-note.up { background:rgba(90,200,140,.14); border:1px solid rgba(120,220,160,.45); }
.link-note.down { background:rgba(230,120,120,.13); border:1px solid rgba(240,140,140,.45); }
.modal h3 { font-size:15px; letter-spacing:1px; text-transform:uppercase; margin:18px 0 8px; color:var(--gold2); font-family:Arial, sans-serif; }
.modal ul { margin:0; padding-left:20px; line-height:1.6; }
.player-tag { display:inline-flex; align-items:center; gap:6px; font-size:14px; margin-bottom:10px; color:var(--muted); }

.cells-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:10px; }
.cells-grid button { text-align:left; border:1px solid var(--line-soft); background:var(--input); color:var(--text); border-radius:12px; padding:10px 12px; cursor:pointer; }
.cells-grid button:hover { border-color:var(--gold2); }
.cells-grid b { color:var(--gold); margin-right:6px; }
.rules ol { line-height:1.7; padding-left:22px; }

/* ===== Вход ===== */
.auth { flex:1; display:flex; align-items:center; justify-content:center; padding:30px 16px; }
.auth-card { width:440px; max-width:100%; padding:36px; text-align:center; border:1px solid var(--line); border-radius:20px;
  background: radial-gradient(circle at 50% 0%, var(--glow), transparent 45%), linear-gradient(145deg, var(--card1), var(--card2)); box-shadow:0 20px 70px rgba(0,0,0,.4); }
.auth-card.wide { width:600px; }
.auth-card .logo { display:block !important; text-align:center !important; margin-bottom:16px !important; }
.auth-card .logo-symbol { margin:0 auto 12px !important; width:92px !important; height:92px !important; font-size:42px !important; }
.auth-card .logo-title { font-size:24px !important; } .auth-card .logo-subtitle { font-size:17px !important; }
.auth-card h2 { margin:6px 0 16px; }
.auth-card input { margin:6px 0; padding:14px; font-size:16px; }
.auth-card .lang-switch { width:max-content; margin:0 auto 16px; }
.auth-card .btn { width:100%; padding:14px; font-size:16px; margin-top:10px; }
.auth-card .btn.outline { background:transparent; }
.auth-grid { display:grid; grid-template-columns:1fr 1fr; gap:0 10px; }
@media (max-width:560px){ .auth-grid { grid-template-columns:1fr; } }
.msg { margin-top:12px; font-size:14px; min-height:1em; }
.msg.err { color:#ffadad; } .msg.ok { color:#a8f0bf; }
.linkbtn { background:none; border:0; color:var(--muted); cursor:pointer; padding:8px 0; font-size:15px; }
.divider { color:var(--muted); margin:8px 0 2px; font-size:14px; }

/* ===== Телефон ===== */
@media (max-width:860px) {
  .platform { display:block; padding:6px; }
  .sidebar { width:100%; border-radius:16px 16px 0 0; padding:12px 14px; }
  .side-head { display:flex; align-items:center; gap:10px; }
  .logo { display:flex; align-items:center; gap:12px; text-align:left; margin:0; }
  .logo-symbol { width:52px; height:52px; font-size:26px; margin:0; }
  .logo-title { font-size:17px; } .logo-subtitle { font-size:14px; margin-top:2px; }
  .burger { display:flex; margin-left:auto; width:46px; height:46px; border-radius:12px; border:1px solid var(--line); background:var(--input); color:var(--gold); font-size:22px; align-items:center; justify-content:center; cursor:pointer; }
  .nav { display:none; margin-top:12px; }
  .sidebar.open .nav { display:flex; }
  .main { border-left:1px solid var(--line); border-top:none; border-radius:0 0 16px 16px; padding:18px 10px 20px; }
  .topbar h1 { font-size:25px; }
  .board { gap:2px; } .cell { padding:2px; border-radius:5px; align-items:center; justify-content:center; }
  .cell .num { font-size:13px; white-space:nowrap; } .cell .ico { font-size:10px; left:1px; bottom:1px; } .cell .ar { display:none; } .cell .nm { display:none; }
  .tokens { position:absolute !important; inset:auto 2px 2px 2px; top:auto; right:2px; max-width:none; justify-content:center; }
  .tok { width:11px; height:11px; border-width:1.5px; }
  .phone-hint { display:block !important; }
  .mbar { display:flex !important; }
  .turn-box .dice, .turn-box #rollBtn, .turn-box > .muted, .turn-box > .who { display:none; }
  .turn-box .msg-box { margin-top:0 !important; }
  .mbar { position:fixed; left:8px; right:8px; bottom:calc(8px + env(safe-area-inset-bottom)); }
  .has-mbar { padding-bottom:96px; }
  .count-btns button { width:40px; height:40px; font-size:16px; }
  .pitem { flex-wrap:wrap; } .pitem .pos { max-width:none; width:100%; text-align:left; padding-left:26px; margin-left:0; }
  .game { gap:12px; }
  .modal-bg { padding:8px; align-items:flex-end; }
  .modal { padding:18px 16px; max-height:88vh; border-radius:18px; }
  .modal h2 { font-size:22px; }
  .modal .row:last-child { position:sticky; bottom:-18px; background:linear-gradient(transparent, var(--card2) 35%); padding:14px 0 4px; margin-bottom:-4px; }
  .modal .row:last-child .btn { flex:1; padding:14px; }
}
@media print { body { background:#fff; color:#000; } }
</style>

  rerender = renderAuth;

  if (authView === "login") inner = `<h2>${t("loginTitle")}</h2>

    <button class="btn" onclick="doRegister()">${t("createAcc")}</button><div class="msg" id="aMsg"></div>
    <button class="linkbtn" onclick="authView='login';renderAuth()">${t("haveAccount")}</button>`; }
  else inner = `<h2>${t("resetTitle")}</h2><input id="pEmail" type="email" placeholder="${t("email")}">
    <button class="btn" onclick="doReset()">${t("sendLink")}</button><div class="msg" id="aMsg"></div>
    <button class="linkbtn" onclick="authView='login';renderAuth()">${t("haveAccount")}</button>`;
  $("app").innerHTML = `<div class="auth"><div class="auth-card ${wide ? "wide" : ""}">
    <div class="logo" style="display:block;margin-bottom:16px"><div class="logo-symbol">${CONFIG.logoSymbol}</div><div class="logo-title">${esc(CONFIG.logoTitle[S.lang])}</div><div class="logo-subtitle">${esc(CONFIG.logoSubtitle[S.lang])}</div></div>
    ${langSwitch()}${inner}</div></div>${footerHtml()}`;
}
function aMsg(text, ok){ const m = $("aMsg"); if (m){ m.textContent = text; m.className = "msg " + (ok ? "ok" : "err"); } }
async function doLogin(){
  const email = $("lEmail").value.trim().toLowerCase(), password = $("lPass").value;
  if (!email || !password) return aMsg(t("fillAll"));
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) return aMsg(t("wrongLogin"));
  await boot();
}
async function doRegister(){
  const last = $("rLast").value.trim(), first = $("rFirst").value.trim(), phone = $("rPhone").value.trim();
  const email = $("rEmail").value.trim().toLowerCase(), p1 = $("rPass").value, p2 = $("rPass2").value, code = $("rCode").value.trim().toUpperCase();
  if (!last || !first || !phone || !email || !p1) return aMsg(t("fillAll"));
  if (!/^\+\d{8,15}$/.test(phone)) return aMsg(t("badPhone"));
  if (p1.length < 6) return aMsg(t("pwShort"));
  if (p1 !== p2) return aMsg(t("pwMismatch"));
  try { if (code) localStorage.setItem("lila_pending_code", code); } catch(e){}
  // Регистрация без письма-подтверждения (серверная функция lila-signup), доступ к игре открывает только администратор
  const { data, error } = await sb.functions.invoke("lila-signup", { body:{ email, password:p1, first_name:first, last_name:last, phone } });
  const st = error ? "error" : (data && data.status);
  if (st === "ok" || st === "exists") {
    const r = await sb.auth.signInWithPassword({ email, password:p1 });
    if (r.error) return aMsg(st === "exists" ? t("emailExists") : t("regError"));
    if (st === "exists") await sb.rpc("lila_self_register");
    aMsg(t("regOk"), true); return boot();
  }
  if (st === "bad_email") return aMsg(t("email"));
  if (st === "bad_password") return aMsg(t("pwShort"));
  return aMsg(t("regError"));
}
async function doReset(){
  const email = $("pEmail").value.trim().toLowerCase(); if (!email) return aMsg(t("fillAll"));
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  if (error) return aMsg(error.message); aMsg(t("linkSent"), true);
}
async function doLogout(){ await sb.auth.signOut(); S.user = null; S.games = { ru:{ game:null, id:null }, kz:{ game:null, id:null }, uz:{ game:null, id:null } }; authView = "login"; renderAuth(); }

/* ========= Загрузка ========= */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) return renderAuth();
  S.user = session.user;
  let code = null; try { code = localStorage.getItem("lila_pending_code"); } catch(e){}
  const j = await sb.rpc("lila_join", { p_code: code || null });
  if (j.data === "not_member") { await sb.auth.signOut(); S.user = null; authView = "login"; renderAuth(); aMsg(t("notMember")); return; }
  if (code) { try { localStorage.removeItem("lila_pending_code"); } catch(e){} }
  const [prof, mem, adm, acc] = await Promise.all([
    sb.from("profiles").select("first_name,last_name,phone,email").eq("id", S.user.id).maybeSingle(),
    sb.from("lila_members").select("*").eq("profile_id", S.user.id).maybeSingle(),
    sb.rpc("lila_is_admin"), sb.rpc("lila_has_access") ]);
  S.profile = prof.data || {}; S.member = mem.data || { lila_role:"student" }; S.isAdmin = !!adm.data; S.hasAccess = !!acc.data;
  renderApp();
}

/* ========= Поле ========= */
function cellOrder(){ // ряды сверху вниз, «змейкой»
  const rows = [];
  for (let r = 7; r >= 0; r--) { const row = []; for (let c = 0; c < 9; c++) row.push(r*9 + 1 + (r % 2 === 0 ? c : 8 - c)); rows.push(row); }
  return rows.flat();
}
function cellXY(n){ const r = Math.floor((n-1)/9), i = (n-1) % 9, c = r % 2 === 0 ? i : 8 - i; return { x:(c + .5) / 9 * 100, y:(7 - r + .5) / 8 * 100 }; }
function linksSvg(){
  let s = `<svg class="links" viewBox="0 0 100 100" preserveAspectRatio="none">
    <defs><marker id="ah" markerWidth="4" markerHeight="4" refX="2.2" refY="2" orient="auto"><path d="M0,0 L4,2 L0,4 z" fill="#5ee3a1"/></marker></defs>`;
  for (const [a,b] of Object.entries(ARROWS)) { const p = cellXY(+a), q = cellXY(b);
    s += `<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" stroke="#5ee3a1" stroke-opacity=".8" vector-effect="non-scaling-stroke" style="stroke-width:2.6px" marker-end="url(#ah)"/>`; }
  for (const [a,b] of Object.entries(SNAKES)) {
    const p = cellXY(+a), q = cellXY(b), dx = q.x - p.x, dy = q.y - p.y, len = Math.hypot(dx, dy), nx = -dy / len, ny = dx / len;
    const waves = Math.max(2, Math.round(len / 9)), amp = 1.6, steps = waves * 12; let d = "";
    for (let i = 0; i <= steps; i++) { const t = i / steps, w = Math.sin(t * waves * Math.PI * 2) * amp * (1 - t * .6);
      d += (i ? " L" : "M") + (p.x + dx * t + nx * w).toFixed(2) + "," + (p.y + dy * t + ny * w).toFixed(2); }
    s += `<path d="${d}" fill="none" stroke="#3b0d12" stroke-opacity=".55" vector-effect="non-scaling-stroke" style="stroke-width:5px" stroke-linecap="round"/>
      <path d="${d}" fill="none" stroke="#ff7a7a" stroke-opacity=".85" vector-effect="non-scaling-stroke" style="stroke-width:2.6px" stroke-linecap="round"/>
      <ellipse cx="${p.x}" cy="${p.y}" rx="1" ry="1.1" fill="#ff7a7a"/>`; }
  return s + `</svg>`;
}
function boardHtml(){
  const g = S.game, cur = g ? g.players[g.turn] : null;
  return `<div class="board-wrap"><div class="board">${cellOrder().map(n => {
    const toks = g ? g.players.filter(p => p.pos === n).map(p => `<span class="tok ${p===cur && !p.done ? 'cur' : ''}" style="background:${p.color}" title="${esc(p.name)}"></span>`).join("") : "";
    return `<div class="cell ${CENTERS.includes(n)?'center':''} ${n===68?'goal':''} ${g && g.last===n?'last':''}" onclick="openCell(${n})">
      <span class="num">${n}<span class="ar">${ARROWS[n]?' ↑':''}${SNAKES[n]?' ↓':''}</span></span>${SNAKES[n] ? '<span class="ico">🐍</span>' : ARROWS[n] ? '<span class="ico">⬆️</span>' : ''}<span class="nm">${esc(C(n).name)}</span>${toks ? `<span class="tokens">${toks}</span>` : ""}</div>`;
  }).join("")}</div>${linksSvg()}</div>
  <div class="legend"><span style="color:#5ee3a1">⬆️ ━━ ${t("legendUp")}</span><span style="color:#ff7a7a">🐍 〰〰 ${t("legendDown")}</span></div>
  <div class="phone-hint">${t("tapHint")}</div>`;

function posLabel(p){ return p.done ? `68 · ${t("finished")}` : !p.entered ? t("waiting") : `${p.pos} · ${C(p.pos).name}`; }

      ${g.log.length ? `<div class="card log">${g.log.slice(-30).reverse().map(l => `<div>${esc(l)}</div>`).join("")}</div>` : ""}
    </div></div>`;

/* ========= Правила хода ========= */
let rolling = false;
async function rollDice(){
  const g = S.game; if (!g || rolling) return; const slotLang = S.lang;
  const p = g.players[g.turn]; if (p.done) return nextTurn();
  rolling = true;
  const r = 1 + Math.floor(Math.random() * 6);
  g.dice = r; ["dice","diceM"].forEach(id => { const d = $(id); if (d) { d.classList.remove("roll"); void d.offsetWidth; d.classList.add("roll"); d.textContent = r; } });
  await new Promise(res => setTimeout(res, 450));
  let showCells = [];
  if (!p.entered) {
    if (r !== 6) { g.msg = `${p.name}: ${r}. ${t("needSix")}`; logIt(g.msg); nextTurn(); }
    else { p.entered = true; p.pos = 6; addPath(p, 1, ""); addPath(p, 6, ""); g.sixes = []; g.last = 6; g.msg = `${p.name}: 6. ${t("entered")}`; logIt(g.msg); showCells = [6]; }
  } else if (r === 6) {
    g.sixes.push(6);
    if (g.sixes.length === 3) { g.sixes = []; g.msg = `${p.name}: 6. ${t("burned")}`; logIt(g.msg); }
    else {
      const sum = g.sixes.reduce((a,b) => a+b, 0), target = p.pos + sum;
      if (target === 68 || (target === 54)) { g.sixes = []; showCells = moveTo(p, target); nextTurn(); }
      else { g.msg = `${p.name}: 6. ${t("sixAgain")} (${sum})`; logIt(g.msg); }
    }
  } else {
    const total = g.sixes.reduce((a,b) => a+b, 0) + r; g.sixes = [];
    if (p.pos + total > 72) { g.msg = `${p.name}: ${total}. ${t("skip")}`; logIt(g.msg); }
    else showCells = moveTo(p, p.pos + total);
    nextTurn();
  }
  rolling = false;
  await saveGame(false, slotLang); renderMain();
  if (showCells.length) showSequence(showCells, p);
}
function addPath(p, cell, via){ p.path.push({ cell, via, notes:"" }); }
function moveTo(p, target){
  const g = S.game, shown = [target];
  p.pos = target; addPath(p, target, "");
  let msg = `${p.name} ${t("moved")} ${target} «${C(target).name}».`;
  if (ARROWS[target]) { const to = ARROWS[target]; p.pos = to; addPath(p, to, "arrow"); shown.push(to); msg += ` ${t("arrowUp")} ${to} «${C(to).name}».`; }
  else if (SNAKES[target]) { const to = SNAKES[target]; p.pos = to; addPath(p, to, "snake"); shown.push(to); msg += ` ${t("snakeDown")} ${to} «${C(to).name}».`; }
  if (p.pos === 68) { p.done = true; msg += ` ${p.name} ${t("reachedGoal")}`; }
  g.last = p.pos; g.msg = msg; logIt(msg);
  return shown;
}
function nextTurn(){
  const g = S.game; if (g.players.every(p => p.done)) return;
  let i = g.turn; do { i = (i + 1) % g.players.length; } while (g.players[i].done);
  g.turn = i;
}
function logIt(s){ S.game.log.push(s); }

/* ========= Карточка клетки ========= */
function cardHtml(n, player, entry){
  const c = C(n), link = ARROWS[n] ? "up" : SNAKES[n] ? "down" : "";
  const note = link ? `<div class="link-note ${link}">${link==="up" ? "↑ " + t("arrowNote") : "↓ " + t("snakeNote")}: ${n} → ${ARROWS[n]||SNAKES[n]} «${esc(C(ARROWS[n]||SNAKES[n]).name)}». ${esc(LINK_NOTE[S.lang][n])}</div>` : "";
  return `${player ? `<div class="player-tag"><span class="tok" style="background:${player.color}"></span> ${esc(player.name)}</div>` : ""}
    <div class="row" style="flex-wrap:nowrap;gap:14px"><div class="cnum">${n}</div><div><h2>${esc(c.name)}</h2>${c.alt ? `<div class="alt">(${esc(c.alt)})</div>` : ""}</div></div>
    <div class="sub">${esc(c.sub)}</div><p class="text">${esc(c.text)}</p>${note}
    <h3>${t("questions")}</h3><ul>${c.q.map(q => `<li>${esc(q)}</li>`).join("")}</ul>
    <h3>${t("practice")}</h3><p>${esc(c.p)}</p>
    ${entry ? `<h3>${t("notes")}</h3><textarea id="noteBox" placeholder="${t("notesPh")}">${esc(entry.notes)}</textarea>` : ""}`;
}
function openCard(html, buttons){
  $("modalRoot").innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeCard()"><div class="modal">${html}<div class="row" style="margin-top:18px;justify-content:flex-end">${buttons}</div></div></div>`;
}
function closeCard(){ $("modalRoot").innerHTML = ""; openCard.last = null; }
function openCell(n){ openCard.last = () => openCell(n); openCard(cardHtml(n), `<button class="btn" onclick="closeCard()">${t("close")}</button>`); }
function showSequence(cells, player){
  let i = 0;
  const show = () => {
    const n = cells[i], entry = [...player.path].reverse().find(e => e.cell === n);
    openCard.last = show;
    const isLast = i === cells.length - 1;
    openCard(cardHtml(n, player, entry), `<button class="btn" onclick="saveNoteAnd(${isLast})">${isLast ? t("close") : t("next") + " →"}</button>`);
    window._seqNext = () => { if (!isLast) { i++; show(); } };
    window._seqEntry = entry;
  };
  show();
}
async function saveNoteAnd(isLast){
  const box = $("noteBox"); if (box && window._seqEntry) window._seqEntry.notes = box.value;
  await saveGame();
  if (isLast) closeCard(); else window._seqNext();
}

/* ========= Путь игроков и итоги ========= */
function pathHtml(){
  const g = S.game;
  return g.players.map(p => `<h3 style="text-transform:none;letter-spacing:0;font-size:18px;color:var(--gold)"><span class="tok" style="display:inline-block;background:${p.color}"></span> ${esc(p.name)}</h3>
    ${p.req ? `<p><b>${t("request")}:</b> ${esc(p.req)}</p>` : ""}
    <ol>${p.path.map(e => `<li><b>${e.cell}. ${esc(C(e.cell).name)}</b>${e.via==="arrow" ? " ↑" : e.via==="snake" ? " ↓" : ""}${e.notes ? `<br><span class="muted">${esc(e.notes)}</span>` : ""}</li>`).join("") || `<li>${t("startPos")}</li>`}</ol>`).join("");
}
function openPath(){ openCard.last = openPath; openCard(`<h2>${t("path")}</h2>${pathHtml()}`, `<button class="btn ghost" onclick="printResults()">${t("printRes")}</button><button class="btn" onclick="closeCard()">${t("close")}</button>`); }
function printResults(){
  const g = S.game, w = window.open("", "_blank"); if (!w) return;
  const body = g.players.map(p => `<h2>${esc(p.name)}</h2>${p.req ? `<p><b>${t("request")}:</b> ${esc(p.req)}</p>` : ""}
    <ol>${p.path.map(e => `<li><b>${e.cell}. ${esc(C(e.cell).name)}</b>${e.via==="arrow" ? " ↑" : e.via==="snake" ? " ↓" : ""}${e.notes ? `<div style="color:#444;margin:2px 0 6px">${esc(e.notes)}</div>` : ""}</li>`).join("")}</ol>`).join("<hr>");
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(CONFIG.name[S.lang])}</title>
    <style>body{font-family:Arial,sans-serif;margin:30px;color:#222;line-height:1.5} h1,h2{font-family:Georgia,serif} li{margin:4px 0}</style></head>
    <body><h1>${esc(CONFIG.name[S.lang])} — ${t("path")}</h1><p>${new Date().toLocaleDateString("ru-RU")}</p>${body}<p style="color:#777;font-size:12px">${t("disclaimer")}</p>
    <script>setTimeout(()=>window.print(),300)<\/script></body></html>`);
  w.document.close();
}
async function endGame(){
  if (!confirm(t("confirmEnd"))) return;
  await saveGame(true); S.game = null; S.gameId = null; renderMain();
}

/* ========= Сохранение ========= */
async function saveGame(finish, slotLang){
  const slot = S.games[slotLang || S.lang], g = slot.game; if (!g) return;
  const done = finish || g.players.every(p => p.done);
  const row = { owner_id:S.user.id, lang:g.lang || S.lang, title:g.players.map(p => p.name).join(", "), state:g, is_finished:done, updated_at:new Date().toISOString() };
  try {
    if (slot.id) await sb.from("lila_games").update(row).eq("id", slot.id);
    else { const { data } = await sb.from("lila_games").insert(row).select("id").single(); if (data) slot.id = data.id; }
  } catch(e) { console.warn(e); }
}
async function renderGames(m){
  m.innerHTML = `<div class="empty">${t("loading")}</div>`;
  const { data } = await sb.from("lila_games").select("id,title,is_finished,updated_at").eq("owner_id", S.user.id).eq("lang", S.lang).order("updated_at", { ascending:false });
  if (!data || !data.length) return m.innerHTML = `<div class="card empty">${t("noGames")}</div>`;
  m.innerHTML = `<div class="card table-wrap"><table class="list"><tr><th>${t("players")}</th><th></th><th></th><th></th></tr>
    ${data.map(g => `<tr><td><b>${esc(g.title)}</b><br><span class="muted" style="font-size:12px">${new Date(g.updated_at).toLocaleString("ru-RU")}</span></td>
      <td>${g.is_finished ? `<span class="badge">${t("gameDone")}</span>` : `<span class="badge ok">${t("gameOn")}</span>`}</td>
      <td><button class="btn small" onclick="loadGame('${g.id}')">${g.is_finished ? t("path") : t("continueG")}</button></td>
      <td><button class="btn small danger" onclick="deleteGame('${g.id}')">${t("del")}</button></td></tr>`).join("")}</table></div>`;
}
async function loadGame(id){
  const { data } = await sb.from("lila_games").select("*").eq("id", id).maybeSingle();
  if (!data) return; S.games[data.lang || "ru"] = { game:data.state, id:data.id }; S.lang = data.lang || "ru"; try { localStorage.setItem("lila_lang", S.lang); } catch(e){} document.documentElement.dataset.lang = S.lang; document.title = CONFIG.name[S.lang]; S.tab = "game"; renderApp();
}
async function deleteGame(id){
  if (!confirm(t("confirmDel"))) return;
  await sb.from("lila_games").delete().eq("id", id); if (S.gameId === id) { S.game = null; S.gameId = null; }
  renderGames($("main"));
}

  const snakes = Object.entries(SNAKES).map(([a,b]) => `<li>${a} «${esc(C(+a).name)}» → ${b} «${esc(C(b).name)}»</li>`).join("");
  m.innerHTML = `<div class="card rules" style="max-width:820px"><ol>${RULES[S.lang].map(r => `<li>${esc(r)}</li>`).join("")}</ol>
    <div class="row" style="align-items:flex-start;gap:30px;margin-top:14px"><div><h3 style="color:#6ee7a8">↑ ${t("arrowNote")}</h3><ul>${arrows}</ul></div>

}
function renderCellList(m){
  m.innerHTML = `<div class="cells-grid">${Array.from({length:72}, (_,i) => i+1).map(n => `<button onclick="openCell(${n})"><b>${n}</b>${esc(C(n).name)}</button>`).join("")}</div>`;
}

/* ========= Доступ ========= */
async function renderAccess(m){
  const role = S.isAdmin ? "roleAdmin" : S.member.lila_role === "teacher" ? "roleTeacher" : "roleStudent";
  const { data:per } = await sb.from("lila_access_periods").select("*").eq("profile_id", S.user.id).eq("status","active").order("created_at",{ascending:false}).limit(1);
  const p = per && per[0];
  let st = S.hasAccess ? `<span class="badge ok">${t("active")}</span>` : `<span class="badge no">${t("inactive")}</span>`;
  if (S.hasAccess && p) st += p.is_unlimited ? ` ${t("unlimited")}` : (p.ends_at ? ` ${t("until")} ${new Date(new Date(p.ends_at).getTime()-1).toLocaleDateString("ru-RU")}` : "");
  m.innerHTML = `<div class="card" style="max-width:640px"><p><b>${t("yourRole")}:</b> ${t(role)}</p><p><b>${t("yourStatus")}:</b> ${st}</p>
    ${S.member.lila_role === "teacher" ? `<p style="margin-top:18px"><b>${t("yourCode")}:</b></p><div class="code">${S.user.id.slice(0,8).toUpperCase()}</div><p class="muted">${t("codeHint")}</p>` : ""}
    ${S.member.lila_role === "student" && !S.isAdmin ? (S.member.teacher_id ? `<p>✅ ${t("teacherLinked")}</p>` : `<label class="f">${t("enterCode")}</label>
      <div class="row"><input id="tCode" maxlength="8" style="max-width:200px;text-transform:uppercase"><button class="btn" onclick="attachTeacher()">${t("attach")}</button></div><div class="msg" id="tMsg"></div>`) : ""}
    ${!S.hasAccess ? `<p class="muted" style="margin-top:18px">${t("noAccessText")}</p>` : ""}</div>`;
}
async function attachTeacher(){
  const { data } = await sb.rpc("lila_join", { p_code: $("tCode").value.trim() });
  if (data === "ok") { toast(t("saved")); await boot(); S.tab = "access"; renderApp(); }
  else { $("tMsg").textContent = t("codeNotFound"); $("tMsg").className = "msg err"; }
}
async function renderUsers(m, admin){

  const { data, error } = await sb.rpc("lila_list_users");
  if (error) return m.innerHTML = `<div class="empty">${t("error")}: ${esc(error.message)}</div>`;
  if (!data.length) return m.innerHTML = `<div class="card empty">${t("noStudents")}</div>`;
  const d = new Date(); d.setMonth(d.getMonth()+1); const def = d.toISOString().slice(0,10);
  m.innerHTML = `<div class="card table-wrap"><table class="list"><tr><th>${t("name")}</th><th>${t("phone")} / ${t("email")}</th>${admin ? `<th>${t("role")}</th>` : ""}<th>${t("access")}</th><th>${t("actions")}</th></tr>

      <td>${u.has_access ? `<span class="badge ok">${u.access_unlimited ? t("unlimited") : t("until") + " " + new Date(new Date(u.access_until).getTime()-1).toLocaleDateString("ru-RU")}</span>` : `<span class="badge no">${t("inactive")}</span>`}</td>
      <td><div class="row" style="flex-wrap:nowrap"><input type="date" id="d_${u.id}" value="${def}" style="width:150px">
        <button class="btn small" onclick="setAccess('${u.id}',false)">${t("give")}</button><button class="btn small ghost" onclick="setAccess('${u.id}',true)">${t("forever")}</button>
        <button class="btn small danger" onclick="setAccess('${u.id}',null)">${t("closeAcc")}</button></div></td></tr>`).join("")}</table></div>`;
}
async function setAccess(id, unlimited){
  const args = unlimited === null ? { p_user:id, p_until:null, p_unlimited:false } : { p_user:id, p_until: unlimited ? null : $("d_" + id).value, p_unlimited: !!unlimited };
  const { data } = await sb.rpc("lila_set_access", args); toast(data === "ok" ? t("saved") : t("error")); renderMain();
}
async function setRole(id, role){ const { data } = await sb.rpc("lila_set_role", { p_user:id, p_role:role }); toast(data === "ok" ? t("saved") : t("error")); }
